<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素材 . Javokobo</title>
<meta name="description" content="ダウンロードできる素材とファイルです。">
<link rel="icon" type="image/png" href="assets/perfil.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="window-container">

  <header class="top-header">
    <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false">メニュー</button>
    <a href="index.html" class="header-brand" style="text-decoration:none;">
      <div class="header-logo"><img src="assets/perfil.png" alt="Javokobo"></div>
      <div class="header-titles">
        <h1>Javokobo</h1>
      </div>
    </a>
    <nav class="header-actions">
      <a class="header-btn" href="https://javokobo.booth.pm/" target="_blank" rel="noopener noreferrer">
        <span class="menu-icon ico-booth"></span><span class="full">ショップ</span>
      </a>
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="menu-box">
        <div class="menu-title">セクション</div>
          <a href="index.html" class="menu-item"><span class="menu-icon ico-teal"></span>はじめに</a>
          <div class="menu-separator"></div>
          <a href="projects.html" class="menu-item"><span class="menu-icon ico-orange"></span>プロジェクト</a>
          <a href="materials.html" class="menu-item active"><span class="menu-icon ico-green"></span>素材</a>
          <a href="javoeditor.html" class="menu-item"><span class="menu-icon ico-pink"></span>JavoEditor</a>
          <div class="menu-separator"></div>
          <a href="contact.html" class="menu-item"><span class="menu-icon ico-teal"></span>お問い合わせ</a>
      </div>
    </aside>

    <section class="content">
      <div class="panel">
        <div class="panel-header">ダウンロード素材</div>
        <div class="panel-body">

          <p>ここでは、私が少しずつアップしている<span class="accent">無料素材</span>（テクスチャ、ブラシ、テンプレートなど）を公開しています。ご自由にダウンロードして、あなたのプロジェクトで使ってください。</p>
          <p>素材はときどき追加していくので、新しいものをお探しの方は、ときどき覗いてみてくださいね。</p>
    
        </div>
      </div>
      
    </section>
  </main>

  <p class="site-footer">Javokobo</p>

</div>

<div class="modal-overlay" id="creditModal" hidden>
  <div class="modal-box">
    <div class="modal-header">
      ダウンロードの前に
      <button type="button" class="modal-close" id="modalCloseBtn" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-icon"></div>
      <p>プロジェクトにクレジットを入れていただけると、とても助かります。たとえば、次のような形です。</p>
      <div class="modal-credit-row">
        <p class="modal-credit"><span id="modalFileName"></span> by 1danieldossantos.github.io</p>
        <button type="button" class="copy-btn" id="modalCopyBtn">コピー</button>
      </div>
      <button type="button" class="header-btn" id="modalDownloadBtn">ダウンロード</button>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
